<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#102846">
    <link rel="icon" href="data:,">
    <title>灵树修行</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #102846;
      }

      #game-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      #rename-button {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
        z-index: 2;
        padding: 7px 11px;
        border: 1px solid rgba(255, 232, 170, 0.72);
        border-radius: 7px;
        color: #fff5cf;
        background: rgba(11, 30, 52, 0.82);
        font: 700 13px sans-serif;
      }

      #name-dialog {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(2, 10, 20, 0.68);
      }

      #name-dialog[hidden] {
        display: none;
      }

      #name-form {
        width: min(100%, 320px);
        padding: 22px;
        border: 2px solid #e2c67d;
        border-radius: 12px;
        background: #f7edd7;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.34);
        text-align: center;
      }

      #name-form h1 {
        margin: 0 0 8px;
        color: #5c3e25;
        font: 700 22px sans-serif;
      }

      #name-form p {
        margin: 0 0 16px;
        color: #765a42;
        font: 14px sans-serif;
      }

      #player-name {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #b99b62;
        border-radius: 7px;
        outline: none;
        color: #3c2c21;
        background: #fffdf6;
        font: 17px sans-serif;
        text-align: center;
      }

      #name-submit {
        width: 100%;
        margin-top: 14px;
        padding: 11px;
        border: 0;
        border-radius: 7px;
        color: #fff;
        background: #3c9063;
        font: 700 15px sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="灵树修行游戏画布"></canvas>
    <button id="rename-button" type="button">改名</button>
    <div id="name-dialog" role="dialog" aria-modal="true" aria-labelledby="name-title" hidden>
      <form id="name-form">
        <h1 id="name-title">给主角取个名字</h1>
        <p>昵称会保存在当前设备，最多 8 个字。</p>
        <input id="player-name" name="playerName" maxlength="8" autocomplete="nickname" placeholder="请输入昵称" required>
        <button id="name-submit" type="submit">确认名字</button>
      </form>
    </div>
    <script src="web/wx-shim.js"></script>
    <script src="web-game.bundle.js"></script>
  </body>
</html>
